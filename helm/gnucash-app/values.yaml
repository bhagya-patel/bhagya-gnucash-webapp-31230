# Default values for gnucash-app
# This is a YAML-formatted file.

# Global settings
global:
  environment: production
  imageRegistry: ghcr.io

# Application settings
app:
  name: gnucash-app
  replicaCount: 3

  image:
    repository: ghcr.io/your-org/gnucash-app
    tag: latest
    pullPolicy: IfNotPresent

  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Horizontal Pod Autoscaler
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  # Pod Disruption Budget
  pdb:
    enabled: true
    minAvailable: 1

  # Service configuration
  service:
    type: ClusterIP
    port: 80
    targetPort: 80

  # Health checks
  healthCheck:
    enabled: true
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  # Environment variables
  env:
    NODE_ENV: production

  # Additional environment variables from secrets
  envSecrets: []
    # - name: SUPABASE_URL
    #   secretName: supabase-credentials
    #   secretKey: url

# Migration job settings
migration:
  enabled: true
  image:
    repository: ghcr.io/your-org/gnucash-app-migration
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  backoffLimit: 3
  ttlSecondsAfterFinished: 300

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: app.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: gnucash-app-tls
      hosts:
        - app.example.com

# Service Account
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Pod Security
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Node selection
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - gnucash-app
          topologyKey: kubernetes.io/hostname

# Network Policy
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "80"
  prometheus.io/path: "/metrics"

# Image pull secrets
imagePullSecrets: []
  # - name: regcred

# ConfigMap data
configMap:
  enabled: false
  data: {}

# Secrets
secrets:
  enabled: false
  data: {}
